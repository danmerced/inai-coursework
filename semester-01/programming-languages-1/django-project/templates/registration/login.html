{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="panel auth"><h1>Вход</h1>
<p>Войдите, чтобы управлять своими задачами и записями.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button>Войти</button></form>
<p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
</section>
{% endblock %}

{% load static %}
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Учебный Django{% endblock %}</title>
<link href="{% static 'style.css' %}" rel="stylesheet">
</head>
<body>
<header><nav class="wrap" aria-label="Основная навигация">
<a class="brand" href="{% url 'tasks:list' %}">StudyDesk</a>
{% if user.is_authenticated %}
<a href="{% url 'tasks:list' %}">Задачи</a>
<a href="{% url 'blog:list' %}">Блог</a>
<span class="username">{{ user.username }}</span>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary">Выйти</button></form>
{% else %}
<a href="{% url 'login' %}">Вход</a><a href="{% url 'register' %}">Регистрация</a>
{% endif %}
</nav></header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer class="wrap">Учебное приложение · Python / Django</footer>
</body>
</html>

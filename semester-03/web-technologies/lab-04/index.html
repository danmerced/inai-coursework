<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main><h1>Регистрация</h1>
<form id="signup">
<label for="name">Имя</label><input id="name" name="name" required autocomplete="name">
<label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email">
<label for="password">Пароль</label><input id="password" type="password" minlength="8" required autocomplete="new-password">
<label for="confirm">Повторите пароль</label><input id="confirm" type="password" required autocomplete="new-password">
<label class="terms"><input type="checkbox" required> Согласен с условиями</label>
<button>Зарегистрироваться</button>
<p id="result" role="status"></p></form></main>
<script src="script.js"></script>
</body>
</html>
